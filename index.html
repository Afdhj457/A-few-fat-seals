<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百爆之人 · 爆裂觉醒</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 30%, #0b0e1a, #05060c 90%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      overflow: hidden;
      position: relative;
      cursor: crosshair;
    }

    /* 背景动态光晕 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 70% 20%, rgba(255, 100, 0, 0.06), transparent 50%),
                  radial-gradient(circle at 30% 80%, rgba(255, 30, 100, 0.08), transparent 50%);
      pointer-events: none;
      animation: bgPulse 6s infinite alternate;
    }

    @keyframes bgPulse {
      0% { opacity: 0.5; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    /* 主卡片 */
    .main-panel {
      position: relative;
      background: rgba(12, 15, 28, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 180, 40, 0.25);
      border-radius: 3rem 3rem 2rem 2rem;
      padding: 2.5rem 2rem 2rem;
      width: min(92%, 540px);
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 0, 0.1) inset, 0 0 40px rgba(255, 100, 0, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s;
      z-index: 10;
    }

    .main-panel.boost {
      transform: scale(1.02);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9), 0 0 0 2px rgba(255, 215, 0, 0.5) inset, 0 0 80px #ff7b00;
    }

    /* 计数爆裂区 */
    .counter-area {
      text-align: center;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .explosion-count {
      font-size: 6rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #fff6b0, #ffb347, #ff4e00);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px #ff6a00, 0 0 20px #ff3c00;
      letter-spacing: 4px;
      transition: transform 0.1s cubic-bezier(0.1, 0.8, 0.3, 1.2);
      filter: drop-shadow(0 0 15px rgba(255, 80, 0, 0.8));
    }

    .counter-label {
      font-size: 1.1rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #ffbc6e;
      text-shadow: 0 0 12px #ff7b00;
      font-weight: 500;
      margin-top: 0.25rem;
      opacity: 0.9;
      background: rgba(0, 0, 0, 0.3);
      display: inline-block;
      padding: 0.25rem 2rem;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 200, 100, 0.3);
    }

    /* 中间大字“爆” */
    .symbol-box {
      position: relative;
      display: flex;
      justify-content: center;
      margin: 0.8rem 0 1.8rem;
    }

    .explosive-char {
      font-size: 9rem;
      font-weight: 900;
      color: #fff1c1;
      text-shadow: 
        0 0 25px #ff8a00,
        0 0 50px #ff2a00,
        0 0 100px #ff3c00,
        0 0 150px #ff7700;
      line-height: 1;
      transition: all 0.1s cubic-bezier(0.2, 0.9, 0.3, 1.5);
      animation: idleFlicker 2s infinite alternate;
      cursor: pointer;
      transform-origin: center;
    }

    @keyframes idleFlicker {
      0% { text-shadow: 0 0 25px #ff8a00, 0 0 50px #ff2a00, 0 0 100px #ff3c00, 0 0 150px #ff7700; }
      100% { text-shadow: 0 0 35px #ffc107, 0 0 70px #ff5100, 0 0 130px #ff2200, 0 0 200px #ffa500; }
    }

    .explosive-char:active {
      transform: scale(0.9);
      transition: 0.05s;
    }

    /* 点击按钮 */
    .click-btn {
      display: block;
      width: 100%;
      background: linear-gradient(145deg, #ffbb2e, #ff7b00);
      border: none;
      border-radius: 120px;
      padding: 1.4rem 1rem;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 8px;
      color: #1a0f00;
      text-shadow: 0 1px 3px rgba(255, 255, 200, 0.8);
      box-shadow: 0 12px 0 #8b3a00, 0 20px 30px rgba(0, 0, 0, 0.7), 0 0 40px #ff5500;
      cursor: pointer;
      transition: all 0.08s ease-out;
      text-transform: uppercase;
      margin-top: 0.5rem;
      border: 1px solid #ffd966;
      transform: translateY(-2px);
    }

    .click-btn:active {
      box-shadow: 0 4px 0 #8b3a00, 0 15px 25px rgba(0, 0, 0, 0.8);
      transform: translateY(6px);
      transition: 0.03s;
    }

    .click-btn:disabled {
      opacity: 0.7;
      filter: grayscale(0.5);
      box-shadow: 0 6px 0 #5a2500, 0 10px 20px rgba(0, 0, 0, 0.8);
      transform: translateY(4px);
      cursor: not-allowed;
    }

    /* 语录气泡 */
    .quote-bubble {
      margin-top: 1.8rem;
      text-align: center;
      font-size: 1rem;
      font-weight: 500;
      color: #ffddb0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      border-radius: 60px;
      padding: 0.9rem 1rem;
      border: 1px solid rgba(255, 200, 80, 0.4);
      box-shadow: 0 0 25px rgba(255, 100, 0, 0.3);
      letter-spacing: 1px;
      transition: all 0.3s;
      min-height: 4.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 粒子画布 */
    #fx-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* 解锁 / 重置小按钮 */
    .utility {
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
      gap: 1rem;
    }

    .mini-btn {
      flex: 1;
      background: rgba(20, 20, 30, 0.8);
      border: 1px solid #555;
      color: #ccc;
      font-size: 0.8rem;
      padding: 0.6rem 0.3rem;
      border-radius: 30px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: 0.2s;
    }

    .mini-btn:hover {
      background: #2a1e0c;
      color: #ffb347;
      border-color: #ffaa33;
      box-shadow: 0 0 15px #ff7700;
    }

    /* 响应式 */
    @media (max-width: 480px) {
      .main-panel {
        padding: 1.8rem 1.2rem 1.5rem;
        border-radius: 2rem;
      }
      .explosive-char {
        font-size: 6rem;
      }
      .explosion-count {
        font-size: 4.5rem;
      }
      .click-btn {
        font-size: 1.3rem;
        padding: 1rem 1rem;
        letter-spacing: 5px;
      }
      .quote-bubble {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <canvas id="fx-canvas"></canvas>

  <div class="main-panel" id="mainPanel">
    <div class="counter-area">
      <div class="explosion-count" id="countDisplay">0</div>
      <div class="counter-label">💥 引爆次数 💥</div>
    </div>

    <div class="symbol-box">
      <div class="explosive-char" id="explosiveChar">爆</div>
    </div>

    <button class="click-btn" id="boomBtn">点 我 爆 炸</button>

    <div class="quote-bubble" id="quoteBubble">
      点击按钮，成为百爆之人
    </div>

    <div class="utility">
      <button class="mini-btn" id="resetBtn">🔄 重置归零</button>
      <button class="mini-btn" id="luckyBtn">🎲 随机引爆</button>
    </div>
  </div>

  <script>
    (function() {
      // ---------- 核心状态 ----------
      let explosionCount = 0;
      const MAX_EXPLOSIONS = 100;        // 百爆之人上限? 实际上我们让他可以超过100，但会显示“百爆达成”
      let isBooming = false;             // 防止狂点导致性能问题（节流）
      const boomBtn = document.getElementById('boomBtn');
      const countDisplay = document.getElementById('countDisplay');
      const explosiveChar = document.getElementById('explosiveChar');
      const quoteBubble = document.getElementById('quoteBubble');
      const mainPanel = document.getElementById('mainPanel');
      const resetBtn = document.getElementById('resetBtn');
      const luckyBtn = document.getElementById('luckyBtn');

      // ---------- 画布粒子系统 ----------
      const canvas = document.getElementById('fx-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let animationFrame = null;
      let canvasWidth = window.innerWidth;
      let canvasHeight = window.innerHeight;

      function resizeCanvas() {
        canvasWidth = window.innerWidth;
        canvasHeight = window.innerHeight;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
      }
      window.addEventListener('resize', () => {
        resizeCanvas();
      });
      resizeCanvas();

      // 粒子类
      class Particle {
        constructor(x, y, options = {}) {
          this.x = x;
          this.y = y;
          const angle = options.angle ?? Math.random() * Math.PI * 2;
          const speed = options.speed ?? (Math.random() * 8 + 3);
          this.vx = Math.cos(angle) * speed * (Math.random() * 0.8 + 0.6);
          this.vy = Math.sin(angle) * speed * (Math.random() * 0.8 + 0.6);
          this.size = options.size ?? (Math.random() * 8 + 4);
          this.color = options.color ?? `hsl(${Math.random() * 60 + 20}, 100%, 60%)`; // 橙黄红
          this.life = 1.0;
          this.decay = options.decay ?? (Math.random() * 0.015 + 0.01);
          this.gravity = options.gravity ?? 0.12;
          this.friction = 0.98;
          this.rotation = Math.random() * 360;
          this.rotationSpeed = (Math.random() - 0.5) * 0.3;
          this.shape = options.shape ?? (Math.random() > 0.7 ? 'circle' : 'spark');
        }

        update() {
          this.vx *= this.friction;
          this.vy *= this.friction;
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;
          this.life -= this.decay;
          this.rotation += this.rotationSpeed;
          return this.life > 0;
        }

        draw(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation * Math.PI / 180);
          ctx.globalAlpha = this.life;
          ctx.shadowColor = '#ffaa00';
          ctx.shadowBlur = 20;
          if (this.shape === 'circle') {
            ctx.beginPath();
            ctx.arc(0, 0, this.size * 0.8, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
          } else {
            // 火花 / 长条
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 25;
            ctx.fillRect(-this.size * 0.2, -this.size * 0.8, this.size * 0.5, this.size * 1.6);
          }
          ctx.restore();
        }
      }

      // 生成爆炸粒子
      function createExplosion(x, y, intensity = 1.0) {
        const count = Math.floor(45 + 55 * intensity);
        const baseHue = Math.random() * 30 + 10; // 10-40 橙红黄
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = (Math.random() * 9 + 3) * intensity;
          const hue = baseHue + (Math.random() * 30 - 15);
          const color = `hsl(${hue}, 100%, ${Math.random() * 30 + 55}%)`;
          const size = Math.random() * 8 + 4;
          particles.push(new Particle(x, y, {
            angle,
            speed,
            color,
            size,
            decay: Math.random() * 0.02 + 0.008,
            gravity: 0.15,
            shape: Math.random() > 0.6 ? 'circle' : 'spark'
          }));
        }
        // 额外加一些亮白闪光
        for (let i = 0; i < 8; i++) {
          particles.push(new Particle(x, y, {
            angle: Math.random() * Math.PI * 2,
            speed: Math.random() * 14 + 6,
            color: `hsl(50, 100%, 80%)`,
            size: Math.random() * 6 + 3,
            decay: 0.025,
            gravity: 0.05,
            shape: 'circle'
          }));
        }
      }

      // 渲染循环
      function renderParticles() {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
        // 更新并绘制
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          const alive = p.update();
          if (!alive) {
            particles.splice(i, 1);
            continue;
          }
          p.draw(ctx);
        }
        // 继续动画，如果粒子数量 > 0 或 强制保留RAF；但我们希望一直有raf但不浪费？如果没粒子可以停掉，但为了随时触发下次，可以停掉并等下次爆炸再启动
        if (particles.length > 0) {
          animationFrame = requestAnimationFrame(renderParticles);
        } else {
          animationFrame = null;
          ctx.clearRect(0, 0, canvasWidth, canvasHeight);
        }
      }

      function startRenderLoop() {
        if (!animationFrame) {
          animationFrame = requestAnimationFrame(renderParticles);
        }
      }

      // ---------- 屏幕震动效果 ----------
      function screenShake(intensity = 8) {
        mainPanel.classList.add('boost');
        document.body.style.transform = `translate(${Math.random()*intensity - intensity/2}px, ${Math.random()*intensity - intensity/2}px)`;
        setTimeout(() => {
          document.body.style.transform = '';
          mainPanel.classList.remove('boost');
        }, 100);
        // 随机抖动几次
        let shakes = 3;
        const shakeInterval = setInterval(() => {
          document.body.style.transform = `translate(${Math.random()*6 - 3}px, ${Math.random()*6 - 3}px)`;
          shakes--;
          if (shakes <= 0) {
            clearInterval(shakeInterval);
            document.body.style.transform = '';
          }
        }, 40);
      }

      // ---------- 语录库 (百爆专属) ----------
      const quotes = [
        "💥 艺术就是爆炸！",
        "🔥 这就是百爆之人的实力！",
        "⚡ 一爆入魂！",
        "🌟 天崩地裂！",
        "💢 你感受到痛苦了吗？",
        "☄️ 爆裂魔法是最强的！",
        "🎇 爆炸吧！现实！",
        "💣 已经……回不去了……",
        "🧨 我的名字叫‘百爆’！",
        "🎆 喝彩吧，这才是爆炸！",
        "✨ 爆炸就是艺术，而我是艺术家。",
        "🔊 轰————！！！",
        "💥 再来一次！",
        "🔥 爆裂觉醒！",
        "💥 百爆之人，恐怖如斯。",
        "🌋 大地在颤抖……",
        "⚡ 炸裂吧！",
        "💢 你的HP已经归零了。",
        "🎆 看啊，这美丽的烟花。",
        "🧨 第100爆！你已是传说。",
      ];

      // 随机获取语录
      function getRandomQuote() {
        return quotes[Math.floor(Math.random() * quotes.length)];
      }

      // ---------- 更新计数显示 ----------
      function updateCountDisplay() {
        countDisplay.textContent = explosionCount;
        // 动态缩放效果
        countDisplay.style.transform = 'scale(1.2)';
        setTimeout(() => {
          countDisplay.style.transform = 'scale(1)';
        }, 100);

        // 百爆成就检测
        if (explosionCount === 100) {
          quoteBubble.textContent = "🎉 百爆达成！你就是百爆之人！🎉";
        } else if (explosionCount > 100 && explosionCount % 10 === 0) {
          // 每10爆提醒一次
          quoteBubble.textContent = `💢 爆裂已超越 ${explosionCount} 次！`;
        }
      }

      // ---------- 核心爆炸逻辑 ----------
      function performExplosion(bypassThrottle = false) {
        // 简单的节流：如果正在爆炸动画，且不是通过随机/重置触发的特殊调用，则忽略快速连点（防止性能问题）
        if (isBooming && !bypassThrottle) return;

        isBooming = true;

        // 增加计数
        explosionCount++;
        updateCountDisplay();

        // 播放爆炸视觉
        const charRect = explosiveChar.getBoundingClientRect();
        const centerX = charRect.left + charRect.width / 2;
        const centerY = charRect.top + charRect.height / 2;

        // 根据连击数增加爆炸强度 (最多2.5倍)
        const intensity = Math.min(1.0 + explosionCount * 0.02, 2.5);

        // 生成粒子 (屏幕中心附近)
        createExplosion(centerX, centerY, intensity);
        // 随机额外位置增加粒子
        createExplosion(centerX + (Math.random() - 0.5) * 100, centerY + (Math.random() - 0.5) * 80, intensity * 0.7);
        startRenderLoop();

        // 震动效果
        screenShake(intensity * 4);

        // 大字动画
        explosiveChar.style.transform = `scale(${1.2 + Math.random() * 0.3}) rotate(${Math.random() * 10 - 5}deg)`;
        explosiveChar.style.transition = '0.08s';
        setTimeout(() => {
          explosiveChar.style.transform = 'scale(1) rotate(0deg)';
          explosiveChar.style.transition = '0.2s cubic-bezier(0.2, 0.9, 0.3, 1.5)';
        }, 80);

        // 改变按钮文字 (短暂)
        const oldText = boomBtn.textContent;
        boomBtn.textContent = '💥 爆！';
        setTimeout(() => {
          boomBtn.textContent = oldText;
        }, 100);

        // 更新语录
        // 特殊节点语录
        if (explosionCount === 1) {
          quoteBubble.textContent = '🔥 第一爆！觉醒吧！';
        } else if (explosionCount === 50) {
          quoteBubble.textContent = '💢 五十爆！接近百爆之人……';
        } else if (explosionCount === 100) {
          quoteBubble.textContent = '🎉 百爆达成！你就是百爆之人！🎉';
        } else if (explosionCount > 100 && explosionCount % 25 === 0) {
          quoteBubble.textContent = `⚡ 爆裂已超越 ${explosionCount} 次！传说还在继续……`;
        } else {
          quoteBubble.textContent = getRandomQuote();
        }

        // 释放节流
        setTimeout(() => {
          isBooming = false;
        }, 100);
      }

      // ---------- 重置 ----------
      function resetCounter() {
        if (explosionCount === 0) {
          quoteBubble.textContent = '已经是零爆了，重新开始吧。';
          return;
        }
        explosionCount = 0;
        updateCountDisplay();
        quoteBubble.textContent = '🔄 归零。新的百爆之路。';
        // 清空粒子（可选，但保留效果更好）
        // 震动小反馈
        mainPanel.classList.add('boost');
        setTimeout(() => mainPanel.classList.remove('boost'), 200);
        // 重置按钮文字
        boomBtn.textContent = '点 我 爆 炸';
      }

      // ---------- 随机引爆（娱乐）----------
      function luckyExplosion() {
        // 随机次数，但每次都会触发粒子
        const times = Math.floor(Math.random() * 5) + 1;
        for (let i = 0; i < times; i++) {
          setTimeout(() => {
            performExplosion(true); // 绕过节流
          }, i * 80);
        }
        quoteBubble.textContent = `🎲 随机引爆 ${times} 连爆！`;
      }

      // ---------- 事件绑定 ----------
      boomBtn.addEventListener('click', (e) => {
        performExplosion(false);
      });

      explosiveChar.addEventListener('click', (e) => {
        // 点击大字也能爆炸
        performExplosion(false);
      });

      resetBtn.addEventListener('click', resetCounter);

      luckyBtn.addEventListener('click', luckyExplosion);

      // 键盘支持：空格/回车触发爆炸
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          performExplosion(false);
        }
        // 按 R 键重置
        if (e.code === 'KeyR') {
          resetCounter();
        }
      });

      // 初始化显示
      updateCountDisplay();
      quoteBubble.textContent = '点击按钮，成为百爆之人';

      // 确保canvas一开始清除
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);

      // 额外彩蛋：连点计数提示（通过双击等略）
      // 为了一开始就有“爆”的感觉，preload一下
      window.addEventListener('load', () => {
        // 稍微延迟一下展示
      });
    })();
  </script>
</body>
</html>

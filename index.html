<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>圆润海豹 · 沙滩 Three.js · 海风与公告</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            pointer-events: none;
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        /* 公告板 - 右上角 (变小) */
        #announcement {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.9);
            color: #1a3b4f;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.6);
            transition: transform 0.2s, background 0.2s;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #announcement:hover {
            background: #ffffff;
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
        }
        #announcement:active {
            transform: scale(0.98);
        }
        #announcement .icon {
            font-size: 15px;
        }
        /* 加载提示 */
        #loading-toast {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 25;
            backdrop-filter: blur(4px);
        }
        #loading-toast.show {
            opacity: 1;
        }
        
        /* 移动端虚拟摇杆 */
        #joystick-zone {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 100;
            touch-action: none;
            display: none; /* 默认隐藏，移动端显示 */
            justify-content: center;
            align-items: center;
        }
        #joystick-knob {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.9);
            position: relative;
            transition: transform 0.05s;
            will-change: transform;
        }
        
        /* 移动端WASD替代触摸按钮? 不需要，摇杆即可 */
        
        /* 桌面端WASD提示 (可选) */
        #wasd-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.4);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(4px);
            pointer-events: none;
            z-index: 10;
        }
        
        /* 根据屏幕宽度显示/隐藏摇杆 */
        @media (max-width: 768px) {
            #joystick-zone {
                display: flex;
            }
            #wasd-hint {
                display: none;
            }
            #info {
                bottom: 15px;
                left: 15px;
                font-size: 12px;
                padding: 6px 12px;
            }
            #announcement {
                top: 10px;
                right: 10px;
                padding: 6px 12px;
                font-size: 12px;
            }
        }
        @media (min-width: 769px) {
            #joystick-zone {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="info">🦭 圆润海豹 · 沙滩日光浴 · 海风轻拂</div>
    
    <!-- 公告板：点击加载外部链接 (变小) -->
    <div id="announcement">
        <span class="icon">📢</span>
        <span>公告</span>
    </div>

    <!-- 加载提示 -->
    <div id="loading-toast">🌊 海风加载中...</div>
    
    <!-- 移动端虚拟摇杆 -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>
    
    <!-- 桌面端WASD提示 -->
    <div id="wasd-hint">WASD 移动视角</div>

    <!-- 引入 Three.js 核心库和辅助库 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xaad4f5);
        scene.fog = new THREE.Fog(0xaad4f5, 20, 60);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 5, 12);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 轨道控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.2, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false; // 关闭自动旋转，避免与WASD冲突，改为手动控制
        controls.autoRotateSpeed = 0.8;
        controls.enableZoom = true;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.enablePan = false; // 禁止平移，保持焦点在海豹附近
        
        // 为了WASD移动，我们需要存储一些状态
        const moveState = {
            forward: false,
            backward: false,
            left: false,
            right: false
        };
        
        // 移动速度
        const moveSpeed = 0.15;
        
        // 相机初始相对位置和角度
        let cameraAngleY = 0; // 水平旋转角度
        let cameraAngleX = 0.3; // 垂直角度偏移量
        
        // 实际上我们使用 OrbitControls 的 target 和相机位置来实现移动
        // 但我们希望WASD移动的是相机围绕目标点的水平位置
        // 简单方法：移动相机和目标点一起
        // 定义相机相对目标的偏移向量，我们用极坐标控制
        
        // 初始化相机位置计算
        function updateCameraPosition() {
            // 获取当前相机到目标的向量
            const target = controls.target;
            const currentOffset = new THREE.Vector3().subVectors(camera.position, target);
            
            // 限制高度，避免穿地
            if (camera.position.y < 1.5) camera.position.y = 1.5;
            
            // 不需要额外操作，由OrbitControls处理
        }

        // --- 灯光 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        sunLight.position.set(10, 20, 5);
        sunLight.castShadow = true;
        sunLight.receiveShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        const d = 20;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 50;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0xccddff, 0.5);
        fillLight.position.set(-5, 5, 10);
        scene.add(fillLight);

        const backLight = new THREE.PointLight(0xffaa66, 0.4);
        backLight.position.set(-5, 5, -10);
        scene.add(backLight);

        // --- 创建沙滩 ---
        const sandGeometry = new THREE.CircleGeometry(20, 64);
        const sandMaterial = new THREE.MeshStandardMaterial({
            color: 0xf5e6c4,
            roughness: 0.9,
            emissive: new THREE.Color(0x332211),
            emissiveIntensity: 0.1,
            side: THREE.DoubleSide
        });
        const sand = new THREE.Mesh(sandGeometry, sandMaterial);
        sand.rotation.x = -Math.PI / 2;
        sand.position.y = -0.01;
        sand.receiveShadow = true;
        scene.add(sand);

        // 沙粒
        for (let i = 0; i < 200; i++) {
            const grainGeo = new THREE.CircleGeometry(0.04 + Math.random()*0.06, 5);
            const grainMat = new THREE.MeshStandardMaterial({
                color: Math.random() > 0.5 ? 0xd9c8a8 : 0xe8d8b8,
                roughness: 0.8,
                emissive: new THREE.Color(0x221100),
                emissiveIntensity: 0.1
            });
            const grain = new THREE.Mesh(grainGeo, grainMat);
            const angle = Math.random() * Math.PI * 2;
            const radius = 3 + Math.random() * 15;
            grain.position.x = Math.cos(angle) * radius;
            grain.position.z = Math.sin(angle) * radius;
            grain.position.y = 0.005 + Math.random() * 0.02;
            grain.rotation.x = -Math.PI / 2;
            grain.rotation.z = Math.random() * Math.PI;
            grain.receiveShadow = true;
            scene.add(grain);
        }

        // 小鹅卵石
        const stoneGeo = new THREE.SphereGeometry(0.15, 6);
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0xbbaa99, roughness: 0.7 });
        for (let i = 0; i < 8; i++) {
            const stone = new THREE.Mesh(stoneGeo, stoneMat);
            const angle = Math.random() * Math.PI * 2;
            const radius = 5 + Math.random() * 10;
            stone.position.x = Math.cos(angle) * radius;
            stone.position.z = Math.sin(angle) * radius;
            stone.position.y = 0.1;
            stone.scale.set(1, 0.4, 1);
            stone.castShadow = true;
            stone.receiveShadow = true;
            scene.add(stone);
        }

        // --- 创建圆润的海豹 ---
        const sealGroup = new THREE.Group();

        const bodyGeo = new THREE.SphereGeometry(1.2, 32, 32);
        const bodyMat = new THREE.MeshStandardMaterial({
            color: 0xa0b8c0,
            roughness: 0.4,
            metalness: 0.1,
            emissive: new THREE.Color(0x223344),
            emissiveIntensity: 0.1
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.scale.set(1.5, 1.0, 1.2);
        body.position.y = 0.8;
        body.castShadow = true;
        body.receiveShadow = true;
        sealGroup.add(body);

        const headGeo = new THREE.SphereGeometry(0.8, 32, 32);
        const headMat = new THREE.MeshStandardMaterial({
            color: 0xb8d0d8,
            roughness: 0.4,
            metalness: 0.1
        });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.set(1.6, 1.1, 0);
        head.scale.set(1.0, 1.0, 0.9);
        head.castShadow = true;
        head.receiveShadow = true;
        sealGroup.add(head);

        // 鼻子
        const noseGeo = new THREE.SphereGeometry(0.2, 16);
        const noseMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
        const nose = new THREE.Mesh(noseGeo, noseMat);
        nose.position.set(2.25, 1.15, 0);
        nose.scale.set(0.8, 0.6, 0.8);
        nose.castShadow = true;
        nose.receiveShadow = true;
        sealGroup.add(nose);

        // 眼睛
        const eyeGeo = new THREE.SphereGeometry(0.12, 16);
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, emissive: new THREE.Color(0x222222), emissiveIntensity: 0.5 });
        
        const eye1 = new THREE.Mesh(eyeGeo, eyeMat);
        eye1.position.set(2.05, 1.35, 0.5);
        eye1.castShadow = true;
        sealGroup.add(eye1);

        const eye2 = new THREE.Mesh(eyeGeo, eyeMat);
        eye2.position.set(2.05, 1.35, -0.5);
        eye2.castShadow = true;
        sealGroup.add(eye2);

        // 眼睛高光
        const highlightGeo = new THREE.SphereGeometry(0.05, 8);
        const highlightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: new THREE.Color(0xffffff), emissiveIntensity: 0.8 });
        const highlight1 = new THREE.Mesh(highlightGeo, highlightMat);
        highlight1.position.set(2.1, 1.4, 0.55);
        sealGroup.add(highlight1);
        const highlight2 = new THREE.Mesh(highlightGeo, highlightMat);
        highlight2.position.set(2.1, 1.4, -0.45);
        sealGroup.add(highlight2);

        // 胡须
        const whiskerMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.6 });
        const whiskerPositions = [
            { pos: [2.3, 1.25, 0.3], rotZ: 0.2 },
            { pos: [2.35, 1.2, 0.25], rotZ: 0.4 },
            { pos: [2.3, 1.25, -0.3], rotZ: -0.2 },
            { pos: [2.35, 1.2, -0.25], rotZ: -0.4 }
        ];
        whiskerPositions.forEach((data) => {
            const whiskerGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.6, 4);
            const whisker = new THREE.Mesh(whiskerGeo, whiskerMat);
            whisker.position.set(data.pos[0], data.pos[1], data.pos[2]);
            whisker.rotation.z = data.rotZ;
            whisker.rotation.x = 0.2;
            whisker.castShadow = true;
            sealGroup.add(whisker);
        });

        // 前鳍状肢
        const flipperGeo = new THREE.SphereGeometry(0.5, 16);
        const flipperMat = new THREE.MeshStandardMaterial({ color: 0x98b0b8, roughness: 0.5 });
        
        const flipperL = new THREE.Mesh(flipperGeo, flipperMat);
        flipperL.position.set(0.9, 0.5, 1.1);
        flipperL.scale.set(0.8, 0.25, 0.5);
        flipperL.rotation.z = 0.4;
        flipperL.rotation.x = -0.3;
        flipperL.rotation.y = 0.5;
        flipperL.castShadow = true;
        flipperL.receiveShadow = true;
        sealGroup.add(flipperL);

        const flipperR = new THREE.Mesh(flipperGeo, flipperMat);
        flipperR.position.set(0.9, 0.5, -1.1);
        flipperR.scale.set(0.8, 0.25, 0.5);
        flipperR.rotation.z = 0.4;
        flipperR.rotation.x = 0.3;
        flipperR.rotation.y = -0.5;
        flipperR.castShadow = true;
        flipperR.receiveShadow = true;
        sealGroup.add(flipperR);

        // 后鳍状肢
        const backFlipperGeo = new THREE.SphereGeometry(0.4, 12);
        const backFlipperMat = new THREE.MeshStandardMaterial({ color: 0x98b0b8, roughness: 0.5 });
        
        const backFlipperL = new THREE.Mesh(backFlipperGeo, backFlipperMat);
        backFlipperL.position.set(-1.5, 0.5, 0.6);
        backFlipperL.scale.set(1.2, 0.2, 0.6);
        backFlipperL.rotation.z = -0.5;
        backFlipperL.rotation.y = 0.3;
        backFlipperL.rotation.x = 0.2;
        backFlipperL.castShadow = true;
        backFlipperL.receiveShadow = true;
        sealGroup.add(backFlipperL);

        const backFlipperR = new THREE.Mesh(backFlipperGeo, backFlipperMat);
        backFlipperR.position.set(-1.5, 0.5, -0.6);
        backFlipperR.scale.set(1.2, 0.2, 0.6);
        backFlipperR.rotation.z = -0.5;
        backFlipperR.rotation.y = -0.3;
        backFlipperR.rotation.x = -0.2;
        backFlipperR.castShadow = true;
        backFlipperR.receiveShadow = true;
        sealGroup.add(backFlipperR);

        sealGroup.rotation.z = -0.05;
        sealGroup.rotation.y = 0.2;
        sealGroup.position.y = 0.1;

        scene.add(sealGroup);

        // 环境装饰
        const ballGeo = new THREE.SphereGeometry(0.5, 16);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, roughness: 0.3, emissive: new THREE.Color(0x442200), emissiveIntensity: 0.2 });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.position.set(-3, 0.5, 3);
        ball.castShadow = true;
        ball.receiveShadow = true;
        scene.add(ball);

        const shellGeo = new THREE.SphereGeometry(0.2, 8);
        const shellMat = new THREE.MeshStandardMaterial({ color: 0xffddbb, roughness: 0.7 });
        for (let i = 0; i < 5; i++) {
            const shell = new THREE.Mesh(shellGeo, shellMat);
            const angle = Math.random() * Math.PI * 2;
            const radius = 6 + Math.random() * 8;
            shell.position.set(Math.cos(angle) * radius, 0.1, Math.sin(angle) * radius);
            shell.scale.set(1, 0.5, 1);
            shell.castShadow = true;
            shell.receiveShadow = true;
            scene.add(shell);
        }

        // --- 海风音频 (Web Audio API) ---
        let audioContext = null;
        let noiseNode = null;
        let gainNode = null;
        let isAudioPlaying = false;

        function initAudio() {
            if (audioContext) return;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioContext.sampleRate * 2;
                const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                const data = buffer.getChannelData(0);
                let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    const pink = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                    b6 = white * 0.115926;
                    data[i] = pink * 0.15 * (0.8 + 0.4 * Math.sin(i * 0.001));
                }
                
                noiseNode = audioContext.createBufferSource();
                noiseNode.buffer = buffer;
                noiseNode.loop = true;

                const filter = audioContext.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 800;
                filter.Q.value = 0.5;

                gainNode = audioContext.createGain();
                gainNode.gain.value = 0.25;

                noiseNode.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioContext.destination);

                noiseNode.start(0);
                isAudioPlaying = true;
                console.log('🌊 海风音效已启动');
            } catch (e) {
                console.warn('音频初始化失败:', e);
            }
        }

        function playOceanSound() {
            if (!audioContext) {
                initAudio();
            } else if (audioContext.state === 'suspended') {
                audioContext.resume().then(() => {
                    console.log('音频上下文已恢复');
                });
            }
        }

        // --- 公告点击事件 ---
        const announcementDiv = document.getElementById('announcement');
        const loadingToast = document.getElementById('loading-toast');

        announcementDiv.addEventListener('click', () => {
            playOceanSound();
            loadingToast.classList.add('show');
            setTimeout(() => loadingToast.classList.remove('show'), 2000);
            window.open('https://afdhj457.github.io/Evolution-history/', '_blank');
        });

        // --- 键盘WASD控制相机移动 ---
        window.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': moveState.forward = true; e.preventDefault(); break;
                case 's': moveState.backward = true; e.preventDefault(); break;
                case 'a': moveState.left = true; e.preventDefault(); break;
                case 'd': moveState.right = true; e.preventDefault(); break;
            }
        });
        
        window.addEventListener('keyup', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': moveState.forward = false; e.preventDefault(); break;
                case 's': moveState.backward = false; e.preventDefault(); break;
                case 'a': moveState.left = false; e.preventDefault(); break;
                case 'd': moveState.right = false; e.preventDefault(); break;
            }
        });

        // --- 移动端虚拟摇杆 ---
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        
        let joystickActive = false;
        let joystickCenter = { x: 0, y: 0 };
        let joystickVector = { x: 0, y: 0 }; // 归一化方向
        
        function updateJoystickPosition(clientX, clientY) {
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = clientX - centerX;
            let dy = clientY - centerY;
            
            const maxDist = rect.width / 2 - 10; // 留边距
            
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxDist) {
                dx = dx / dist * maxDist;
                dy = dy / dist * maxDist;
            }
            
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            
            // 计算归一化向量 (-1 到 1)
            joystickVector.x = dx / maxDist;
            joystickVector.y = dy / maxDist;
        }
        
        function resetJoystick() {
            joystickKnob.style.transform = `translate(0px, 0px)`;
            joystickVector.x = 0;
            joystickVector.y = 0;
            joystickActive = false;
        }
        
        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            joystickActive = true;
            const touch = e.touches[0];
            updateJoystickPosition(touch.clientX, touch.clientY);
        }, { passive: false });
        
        joystickZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!joystickActive) return;
            const touch = e.touches[0];
            updateJoystickPosition(touch.clientX, touch.clientY);
        }, { passive: false });
        
        joystickZone.addEventListener('touchend', (e) => {
            e.preventDefault();
            resetJoystick();
        }, { passive: false });
        
        joystickZone.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            resetJoystick();
        }, { passive: false });
        
        // 鼠标事件支持桌面测试 (可选)
        joystickZone.addEventListener('mousedown', (e) => {
            e.preventDefault();
            joystickActive = true;
            updateJoystickPosition(e.clientX, e.clientY);
        });
        
        window.addEventListener('mousemove', (e) => {
            if (!joystickActive) return;
            updateJoystickPosition(e.clientX, e.clientY);
        });
        
        window.addEventListener('mouseup', () => {
            if (joystickActive) {
                resetJoystick();
            }
        });

        // --- 相机移动逻辑 (每帧) ---
        // 获取相机相对于目标点的水平方向
        function moveCamera() {
            // 键盘输入
            let moveX = 0;
            let moveZ = 0;
            
            if (moveState.forward) moveZ += 1;
            if (moveState.backward) moveZ -= 1;
            if (moveState.left) moveX -= 1;
            if (moveState.right) moveX += 1;
            
            // 摇杆输入 (覆盖键盘)
            if (Math.abs(joystickVector.x) > 0.1 || Math.abs(joystickVector.y) > 0.1) {
                moveX = joystickVector.x;
                moveZ = -joystickVector.y; // 摇杆上为负值，对应向前
            }
            
            // 归一化防止斜向加速
            const len = Math.sqrt(moveX*moveX + moveZ*moveZ);
            if (len > 1) {
                moveX /= len;
                moveZ /= len;
            }
            
            if (moveX === 0 && moveZ === 0) return;
            
            // 计算相机朝向：从相机到目标的方向
            const target = controls.target;
            const cameraToTarget = new THREE.Vector3().subVectors(target, camera.position).normalize();
            
            // 水平方向 (忽略Y轴)
            const forwardDir = new THREE.Vector3(cameraToTarget.x, 0, cameraToTarget.z).normalize();
            if (forwardDir.length() < 0.1) forwardDir.set(0, 0, -1); // 避免垂直向下看时出错
            
            // 右方向
            const rightDir = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), forwardDir).normalize();
            // 注意cross的顺序：up x forward = right? 实际上 up(0,1,0) x forward = right? 
            // 检查：如果forward是(0,0,-1)，up(0,1,0) x forward = (1,0,0) 所以正确
            
            // 移动向量
            const moveDelta = new THREE.Vector3();
            moveDelta.addScaledVector(forwardDir, moveZ * moveSpeed);
            moveDelta.addScaledVector(rightDir, moveX * moveSpeed);
            
            // 同时移动相机和目标点
            camera.position.add(moveDelta);
            controls.target.add(moveDelta);
            
            // 保持相机高度合理
            if (camera.position.y < 1.5) camera.position.y = 1.5;
            if (camera.position.y > 15) camera.position.y = 15;
            
            // 限制移动范围，不要超出沙滩
            const maxDist = 18;
            const targetDist = Math.sqrt(controls.target.x*controls.target.x + controls.target.z*controls.target.z);
            if (targetDist > maxDist) {
                const factor = maxDist / targetDist;
                controls.target.x *= factor;
                controls.target.z *= factor;
                // 重新调整相机位置，保持相对关系
                camera.position.x = controls.target.x + (camera.position.x - controls.target.x) * factor;
                camera.position.z = controls.target.z + (camera.position.z - controls.target.z) * factor;
            }
        }

        // --- 动画循环 ---
        let clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const elapsedTime = performance.now() / 1000;

            // 海豹轻微晃动
            if (sealGroup) {
                sealGroup.position.y = 0.1 + Math.sin(elapsedTime * 2) * 0.02;
                sealGroup.rotation.y = 0.2 + Math.sin(elapsedTime * 0.8) * 0.03;
                sealGroup.rotation.z = -0.05 + Math.sin(elapsedTime * 1.5) * 0.01;
            }

            // 处理相机移动
            moveCamera();
            
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // 窗口大小自适应
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 初始化时禁用自动旋转，让用户控制
        controls.autoRotate = false;
        
        // 提示
        console.log('🦭 使用 WASD 或移动端摇杆移动视角。点击右上角公告播放海风并打开链接。');
    </script>
</body>
</html>

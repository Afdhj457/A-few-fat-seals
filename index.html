<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>圆润海豹 · 沙滩 Three.js · 鱼群游过</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            pointer-events: none;
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        /* 公告板 */
        #announcement {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.9);
            color: #1a3b4f;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.6);
            transition: transform 0.2s, background 0.2s;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #announcement:hover {
            background: #ffffff;
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
        }
        #announcement:active {
            transform: scale(0.98);
        }
        #announcement .icon {
            font-size: 15px;
        }
        /* 加载提示 */
        #loading-toast {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 25;
            backdrop-filter: blur(4px);
        }
        #loading-toast.show {
            opacity: 1;
        }
        
        /* 移动端虚拟摇杆 */
        #joystick-zone {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 100;
            touch-action: none;
            display: none;
            justify-content: center;
            align-items: center;
        }
        #joystick-knob {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.9);
            position: relative;
            transition: transform 0.05s;
            will-change: transform;
        }
        
        #wasd-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.4);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(4px);
            pointer-events: none;
            z-index: 10;
        }
        
        /* 嗷呜提示 */
        #woof-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            color: #1a3b4f;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 200;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            white-space: nowrap;
        }
        #woof-toast.show {
            opacity: 1;
        }
        
        @media (max-width: 768px) {
            #joystick-zone {
                display: flex;
            }
            #wasd-hint {
                display: none;
            }
            #info {
                bottom: 15px;
                left: 15px;
                font-size: 12px;
                padding: 6px 12px;
            }
            #announcement {
                top: 10px;
                right: 10px;
                padding: 6px 12px;
                font-size: 12px;
            }
            #woof-toast {
                font-size: 18px;
                padding: 10px 20px;
            }
        }
        @media (min-width: 769px) {
            #joystick-zone {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="info">🦭 圆润海豹 · 点击海豹会嗷呜～ · 水下有鱼</div>
    
    <div id="announcement">
        <span class="icon">📢</span>
        <span>公告</span>
    </div>

    <div id="loading-toast">🌊 海风加载中...</div>
    
    <div id="woof-toast">🦭 嗷呜～</div>
    
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>
    
    <div id="wasd-hint">WASD 移动视角 · 点击海豹</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xaad4f5);
        scene.fog = new THREE.Fog(0xaad4f5, 20, 60);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 5, 12);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.2, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.enablePan = false;
        
        // 射线检测器
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        // 移动状态
        const moveState = { forward: false, backward: false, left: false, right: false };
        const moveSpeed = 0.15;

        // --- 灯光 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        sunLight.position.set(10, 20, 5);
        sunLight.castShadow = true;
        sunLight.receiveShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        const d = 20;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 50;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0xccddff, 0.5);
        fillLight.position.set(-5, 5, 10);
        scene.add(fillLight);

        const backLight = new THREE.PointLight(0xffaa66, 0.4);
        backLight.position.set(-5, 5, -10);
        scene.add(backLight);

        // --- 创建水下环境 (一个半透明的水面层，用于看到水下的鱼) ---
        const waterPlaneGeometry = new THREE.CircleGeometry(20, 64);
        const waterPlaneMaterial = new THREE.MeshStandardMaterial({
            color: 0x4a9ec9,
            transparent: true,
            opacity: 0.25,
            side: THREE.DoubleSide,
            roughness: 0.2,
            metalness: 0.1,
            emissive: new THREE.Color(0x1a3b4f),
            emissiveIntensity: 0.1
        });
        const waterPlane = new THREE.Mesh(waterPlaneGeometry, waterPlaneMaterial);
        waterPlane.rotation.x = -Math.PI / 2;
        waterPlane.position.y = 0.02; // 略高于沙地，形成水面
        waterPlane.receiveShadow = false;
        waterPlane.renderOrder = 1; // 在水下鱼之后渲染
        scene.add(waterPlane);

        // --- 沙滩 ---
        const sandGeometry = new THREE.CircleGeometry(20, 64);
        const sandMaterial = new THREE.MeshStandardMaterial({
            color: 0xf5e6c4,
            roughness: 0.9,
            emissive: new THREE.Color(0x332211),
            emissiveIntensity: 0.1,
            side: THREE.DoubleSide
        });
        const sand = new THREE.Mesh(sandGeometry, sandMaterial);
        sand.rotation.x = -Math.PI / 2;
        sand.position.y = -0.02;
        sand.receiveShadow = true;
        sand.renderOrder = 0;
        scene.add(sand);

        // 沙粒
        for (let i = 0; i < 200; i++) {
            const grainGeo = new THREE.CircleGeometry(0.04 + Math.random()*0.06, 5);
            const grainMat = new THREE.MeshStandardMaterial({
                color: Math.random() > 0.5 ? 0xd9c8a8 : 0xe8d8b8,
                roughness: 0.8,
                emissive: new THREE.Color(0x221100),
                emissiveIntensity: 0.1
            });
            const grain = new THREE.Mesh(grainGeo, grainMat);
            const angle = Math.random() * Math.PI * 2;
            const radius = 3 + Math.random() * 15;
            grain.position.x = Math.cos(angle) * radius;
            grain.position.z = Math.sin(angle) * radius;
            grain.position.y = 0.005 + Math.random() * 0.02;
            grain.rotation.x = -Math.PI / 2;
            grain.rotation.z = Math.random() * Math.PI;
            grain.receiveShadow = true;
            scene.add(grain);
        }

        // 鹅卵石
        const stoneGeo = new THREE.SphereGeometry(0.15, 6);
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0xbbaa99, roughness: 0.7 });
        for (let i = 0; i < 8; i++) {
            const stone = new THREE.Mesh(stoneGeo, stoneMat);
            const angle = Math.random() * Math.PI * 2;
            const radius = 5 + Math.random() * 10;
            stone.position.x = Math.cos(angle) * radius;
            stone.position.z = Math.sin(angle) * radius;
            stone.position.y = 0.1;
            stone.scale.set(1, 0.4, 1);
            stone.castShadow = true;
            stone.receiveShadow = true;
            scene.add(stone);
        }

        // --- 创建鱼群 (水下) ---
        const fishGroup = new THREE.Group();
        const fishes = [];
        
        // 创建一条鱼的函数
        function createFish() {
            const fishGroup = new THREE.Group();
            
            // 鱼身 (椭球体)
            const bodyGeo = new THREE.SphereGeometry(0.3, 12, 12);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(Math.random() * 0.15 + 0.05, 0.8, 0.6), // 橙红色系
                roughness: 0.4,
                metalness: 0.2,
                emissive: new THREE.Color(0x442200),
                emissiveIntensity: 0.1
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.scale.set(1.6, 0.8, 0.7);
            body.castShadow = true;
            body.receiveShadow = false;
            fishGroup.add(body);
            
            // 尾巴 (三角形)
            const tailGeo = new THREE.ConeGeometry(0.25, 0.4, 4);
            const tailMat = new THREE.MeshStandardMaterial({
                color: bodyMat.color.clone().multiplyScalar(0.8),
                roughness: 0.5
            });
            const tail = new THREE.Mesh(tailGeo, tailMat);
            tail.position.set(-0.6, 0, 0);
            tail.rotation.z = Math.PI / 2;
            tail.rotation.y = Math.PI / 2;
            tail.scale.set(0.8, 0.5, 0.3);
            fishGroup.add(tail);
            
            // 眼睛
            const eyeGeo = new THREE.SphereGeometry(0.06, 6);
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const eye = new THREE.Mesh(eyeGeo, eyeMat);
            eye.position.set(0.35, 0.12, 0.18);
            fishGroup.add(eye);
            
            const eye2 = new THREE.Mesh(eyeGeo, eyeMat);
            eye2.position.set(0.35, 0.12, -0.18);
            fishGroup.add(eye2);
            
            // 背鳍
            const finGeo = new THREE.ConeGeometry(0.12, 0.25, 4);
            const finMat = new THREE.MeshStandardMaterial({
                color: bodyMat.color.clone().multiplyScalar(0.7),
                roughness: 0.6
            });
            const fin = new THREE.Mesh(finGeo, finMat);
            fin.position.set(0.05, 0.3, 0);
            fin.rotation.x = 0.3;
            fin.scale.set(0.8, 1, 0.3);
            fishGroup.add(fin);
            
            // 随机颜色微调
            return fishGroup;
        }
        
        // 创建多条鱼并随机分布在水下
        const fishCount = 15;
        for (let i = 0; i < fishCount; i++) {
            const fish = createFish();
            
            // 随机起始位置，在水下（y < 0）但不要太深
            const angle = Math.random() * Math.PI * 2;
            const radius = 3 + Math.random() * 14;
            fish.position.x = Math.cos(angle) * radius;
            fish.position.z = Math.sin(angle) * radius;
            fish.position.y = -0.5 - Math.random() * 1.5; // 水下
            
            // 随机旋转方向
            fish.rotation.y = Math.random() * Math.PI * 2;
            fish.rotation.x = (Math.random() - 0.5) * 0.3;
            fish.rotation.z = (Math.random() - 0.5) * 0.3;
            
            // 存储游动速度和方向
            fish.userData = {
                speed: 0.01 + Math.random() * 0.03,
                direction: new THREE.Vector3(
                    Math.random() * 2 - 1,
                    (Math.random() - 0.5) * 0.1,
                    Math.random() * 2 - 1
                ).normalize(),
                wobblePhase: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.02 + Math.random() * 0.03,
                baseY: fish.position.y,
                radius: radius,
                angle: angle,
                angularSpeed: (Math.random() * 0.5 + 0.2) * (Math.random() > 0.5 ? 1 : -1) * 0.01
            };
            
            // 让鱼的方向和初始旋转一致
            fish.lookAt(fish.position.clone().add(fish.userData.direction));
            
            scene.add(fish);
            fishes.push(fish);
        }

        // --- 创建海豹 ---
        const sealGroup = new THREE.Group();

        const bodyGeo = new THREE.SphereGeometry(1.2, 32, 32);
        const bodyMat = new THREE.MeshStandardMaterial({
            color: 0xa0b8c0,
            roughness: 0.4,
            metalness: 0.1,
            emissive: new THREE.Color(0x223344),
            emissiveIntensity: 0.1
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.scale.set(1.5, 1.0, 1.2);
        body.position.y = 0.8;
        body.castShadow = true;
        body.receiveShadow = true;
        body.userData.isSealPart = true;
        sealGroup.add(body);

        const headGeo = new THREE.SphereGeometry(0.8, 32, 32);
        const headMat = new THREE.MeshStandardMaterial({
            color: 0xb8d0d8,
            roughness: 0.4,
            metalness: 0.1
        });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.set(1.6, 1.1, 0);
        head.scale.set(1.0, 1.0, 0.9);
        head.castShadow = true;
        head.receiveShadow = true;
        head.userData.isSealPart = true;
        sealGroup.add(head);

        const noseGeo = new THREE.SphereGeometry(0.2, 16);
        const noseMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
        const nose = new THREE.Mesh(noseGeo, noseMat);
        nose.position.set(2.25, 1.15, 0);
        nose.scale.set(0.8, 0.6, 0.8);
        nose.castShadow = true;
        nose.receiveShadow = true;
        nose.userData.isSealPart = true;
        sealGroup.add(nose);

        const eyeGeo = new THREE.SphereGeometry(0.12, 16);
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, emissive: new THREE.Color(0x222222), emissiveIntensity: 0.5 });
        
        const eye1 = new THREE.Mesh(eyeGeo, eyeMat);
        eye1.position.set(2.05, 1.35, 0.5);
        eye1.castShadow = true;
        eye1.userData.isSealPart = true;
        sealGroup.add(eye1);

        const eye2 = new THREE.Mesh(eyeGeo, eyeMat);
        eye2.position.set(2.05, 1.35, -0.5);
        eye2.castShadow = true;
        eye2.userData.isSealPart = true;
        sealGroup.add(eye2);

        const highlightGeo = new THREE.SphereGeometry(0.05, 8);
        const highlightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: new THREE.Color(0xffffff), emissiveIntensity: 0.8 });
        const highlight1 = new THREE.Mesh(highlightGeo, highlightMat);
        highlight1.position.set(2.1, 1.4, 0.55);
        highlight1.userData.isSealPart = true;
        sealGroup.add(highlight1);
        const highlight2 = new THREE.Mesh(highlightGeo, highlightMat);
        highlight2.position.set(2.1, 1.4, -0.45);
        highlight2.userData.isSealPart = true;
        sealGroup.add(highlight2);

        const whiskerMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.6 });
        const whiskerPositions = [
            { pos: [2.3, 1.25, 0.3], rotZ: 0.2 },
            { pos: [2.35, 1.2, 0.25], rotZ: 0.4 },
            { pos: [2.3, 1.25, -0.3], rotZ: -0.2 },
            { pos: [2.35, 1.2, -0.25], rotZ: -0.4 }
        ];
        whiskerPositions.forEach((data) => {
            const whiskerGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.6, 4);
            const whisker = new THREE.Mesh(whiskerGeo, whiskerMat);
            whisker.position.set(data.pos[0], data.pos[1], data.pos[2]);
            whisker.rotation.z = data.rotZ;
            whisker.rotation.x = 0.2;
            whisker.castShadow = true;
            whisker.userData.isSealPart = true;
            sealGroup.add(whisker);
        });

        const flipperGeo = new THREE.SphereGeometry(0.5, 16);
        const flipperMat = new THREE.MeshStandardMaterial({ color: 0x98b0b8, roughness: 0.5 });
        
        const flipperL = new THREE.Mesh(flipperGeo, flipperMat);
        flipperL.position.set(0.9, 0.5, 1.1);
        flipperL.scale.set(0.8, 0.25, 0.5);
        flipperL.rotation.z = 0.4;
        flipperL.rotation.x = -0.3;
        flipperL.rotation.y = 0.5;
        flipperL.castShadow = true;
        flipperL.receiveShadow = true;
        flipperL.userData.isSealPart = true;
        flipperL.userData.isFlipper = true;
        flipperL.userData.baseRotZ = 0.4;
        sealGroup.add(flipperL);

        const flipperR = new THREE.Mesh(flipperGeo, flipperMat);
        flipperR.position.set(0.9, 0.5, -1.1);
        flipperR.scale.set(0.8, 0.25, 0.5);
        flipperR.rotation.z = 0.4;
        flipperR.rotation.x = 0.3;
        flipperR.rotation.y = -0.5;
        flipperR.castShadow = true;
        flipperR.receiveShadow = true;
        flipperR.userData.isSealPart = true;
        flipperR.userData.isFlipper = true;
        flipperR.userData.baseRotZ = 0.4;
        sealGroup.add(flipperR);

        const backFlipperGeo = new THREE.SphereGeometry(0.4, 12);
        const backFlipperMat = new THREE.MeshStandardMaterial({ color: 0x98b0b8, roughness: 0.5 });
        
        const backFlipperL = new THREE.Mesh(backFlipperGeo, backFlipperMat);
        backFlipperL.position.set(-1.5, 0.5, 0.6);
        backFlipperL.scale.set(1.2, 0.2, 0.6);
        backFlipperL.rotation.z = -0.5;
        backFlipperL.rotation.y = 0.3;
        backFlipperL.rotation.x = 0.2;
        backFlipperL.castShadow = true;
        backFlipperL.receiveShadow = true;
        backFlipperL.userData.isSealPart = true;
        backFlipperL.userData.isFlipper = true;
        backFlipperL.userData.baseRotZ = -0.5;
        sealGroup.add(backFlipperL);

        const backFlipperR = new THREE.Mesh(backFlipperGeo, backFlipperMat);
        backFlipperR.position.set(-1.5, 0.5, -0.6);
        backFlipperR.scale.set(1.2, 0.2, 0.6);
        backFlipperR.rotation.z = -0.5;
        backFlipperR.rotation.y = -0.3;
        backFlipperR.rotation.x = -0.2;
        backFlipperR.castShadow = true;
        backFlipperR.receiveShadow = true;
        backFlipperR.userData.isSealPart = true;
        backFlipperR.userData.isFlipper = true;
        backFlipperR.userData.baseRotZ = -0.5;
        sealGroup.add(backFlipperR);

        sealGroup.rotation.z = -0.05;
        sealGroup.rotation.y = 0.2;
        sealGroup.position.y = 0.1;

        scene.add(sealGroup);

        // 环境装饰
        const ballGeo = new THREE.SphereGeometry(0.5, 16);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, roughness: 0.3, emissive: new THREE.Color(0x442200), emissiveIntensity: 0.2 });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.position.set(-3, 0.5, 3);
        ball.castShadow = true;
        ball.receiveShadow = true;
        scene.add(ball);

        const shellGeo = new THREE.SphereGeometry(0.2, 8);
        const shellMat = new THREE.MeshStandardMaterial({ color: 0xffddbb, roughness: 0.7 });
        for (let i = 0; i < 5; i++) {
            const shell = new THREE.Mesh(shellGeo, shellMat);
            const angle = Math.random() * Math.PI * 2;
            const radius = 6 + Math.random() * 8;
            shell.position.set(Math.cos(angle) * radius, 0.1, Math.sin(angle) * radius);
            shell.scale.set(1, 0.5, 1);
            shell.castShadow = true;
            shell.receiveShadow = true;
            scene.add(shell);
        }

        // --- 音频 ---
        let audioContext = null;
        let noiseNode = null;
        let gainNode = null;
        let isAudioPlaying = false;

        function initAudio() {
            if (audioContext) return;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioContext.sampleRate * 2;
                const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                const data = buffer.getChannelData(0);
                let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    const pink = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                    b6 = white * 0.115926;
                    data[i] = pink * 0.15 * (0.8 + 0.4 * Math.sin(i * 0.001));
                }
                
                noiseNode = audioContext.createBufferSource();
                noiseNode.buffer = buffer;
                noiseNode.loop = true;

                const filter = audioContext.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 800;
                filter.Q.value = 0.5;

                gainNode = audioContext.createGain();
                gainNode.gain.value = 0.25;

                noiseNode.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioContext.destination);

                noiseNode.start(0);
                isAudioPlaying = true;
                console.log('🌊 海风音效已启动');
            } catch (e) {
                console.warn('音频初始化失败:', e);
            }
        }

        function playOceanSound() {
            if (!audioContext) {
                initAudio();
            } else if (audioContext.state === 'suspended') {
                audioContext.resume().then(() => {
                    console.log('音频上下文已恢复');
                });
            }
        }

        // 嗷呜叫声
        function playWoofSound() {
            if (!audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.warn('音频上下文创建失败');
                    return;
                }
            }
            
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            try {
                const now = audioContext.currentTime;
                
                const osc1 = audioContext.createOscillator();
                const osc2 = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                osc1.type = 'sine';
                osc2.type = 'triangle';
                
                osc1.frequency.setValueAtTime(600, now);
                osc1.frequency.exponentialRampToValueAtTime(300, now + 0.15);
                osc1.frequency.exponentialRampToValueAtTime(450, now + 0.3);
                osc1.frequency.exponentialRampToValueAtTime(200, now + 0.6);
                
                osc2.frequency.setValueAtTime(598, now);
                osc2.frequency.exponentialRampToValueAtTime(298, now + 0.15);
                osc2.frequency.exponentialRampToValueAtTime(448, now + 0.3);
                osc2.frequency.exponentialRampToValueAtTime(198, now + 0.6);
                
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.4, now + 0.05);
                gainNode.gain.linearRampToValueAtTime(0.3, now + 0.2);
                gainNode.gain.linearRampToValueAtTime(0.15, now + 0.4);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.7);
                
                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.7);
                osc2.stop(now + 0.7);
                
                console.log('🦭 嗷呜～');
            } catch (e) {
                console.warn('嗷呜播放失败:', e);
            }
        }

        // --- 公告点击 ---
        const announcementDiv = document.getElementById('announcement');
        const loadingToast = document.getElementById('loading-toast');

        announcementDiv.addEventListener('click', () => {
            playOceanSound();
            loadingToast.classList.add('show');
            setTimeout(() => loadingToast.classList.remove('show'), 2000);
            window.open('https://afdhj457.github.io/Evolution-history/', '_blank');
        });

        // --- 点击海豹检测 (桌面 + 移动端) ---
        const woofToast = document.getElementById('woof-toast');
        
        // 通用的点击处理函数
        function handleSealClick(clientX, clientY) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(sealGroup.children, true);
            
            if (intersects.length > 0) {
                playWoofSound();
                woofToast.classList.add('show');
                setTimeout(() => woofToast.classList.remove('show'), 800);
                
                sealGroup.userData.jumpTime = 0.3;
                sealGroup.userData.jumpOffset = 0.4;
                
                playOceanSound();
                return true;
            }
            return false;
        }
        
        // 桌面端点击
        renderer.domElement.addEventListener('click', (event) => {
            handleSealClick(event.clientX, event.clientY);
        });
        
        // 移动端触摸
        renderer.domElement.addEventListener('touchstart', (event) => {
            if (event.touches.length === 1) {
                const touch = event.touches[0];
                // 延迟一点，避免与拖拽旋转冲突？不冲突，这里只检测海豹
                handleSealClick(touch.clientX, touch.clientY);
            }
        }, { passive: true });

        // --- 键盘WASD ---
        window.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': moveState.forward = true; e.preventDefault(); break;
                case 's': moveState.backward = true; e.preventDefault(); break;
                case 'a': moveState.left = true; e.preventDefault(); break;
                case 'd': moveState.right = true; e.preventDefault(); break;
            }
        });
        
        window.addEventListener('keyup', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': moveState.forward = false; e.preventDefault(); break;
                case 's': moveState.backward = false; e.preventDefault(); break;
                case 'a': moveState.left = false; e.preventDefault(); break;
                case 'd': moveState.right = false; e.preventDefault(); break;
            }
        });

        // --- 移动端虚拟摇杆 ---
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        
        let joystickActive = false;
        let joystickVector = { x: 0, y: 0 };
        
        function updateJoystickPosition(clientX, clientY) {
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = clientX - centerX;
            let dy = clientY - centerY;
            
            const maxDist = rect.width / 2 - 10;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxDist) {
                dx = dx / dist * maxDist;
                dy = dy / dist * maxDist;
            }
            
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joystickVector.x = dx / maxDist;
            joystickVector.y = dy / maxDist;
        }
        
        function resetJoystick() {
            joystickKnob.style.transform = `translate(0px, 0px)`;
            joystickVector.x = 0;
            joystickVector.y = 0;
            joystickActive = false;
        }
        
        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            joystickActive = true;
            const touch = e.touches[0];
            updateJoystickPosition(touch.clientX, touch.clientY);
        }, { passive: false });
        
        joystickZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!joystickActive) return;
            const touch = e.touches[0];
            updateJoystickPosition(touch.clientX, touch.clientY);
        }, { passive: false });
        
        joystickZone.addEventListener('touchend', (e) => {
            e.preventDefault();
            resetJoystick();
        }, { passive: false });
        
        joystickZone.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            resetJoystick();
        }, { passive: false });

        // --- 相机移动 ---
        function moveCamera() {
            let moveX = 0;
            let moveZ = 0;
            
            if (moveState.forward) moveZ += 1;
            if (moveState.backward) moveZ -= 1;
            if (moveState.left) moveX -= 1;
            if (moveState.right) moveX += 1;
            
            if (Math.abs(joystickVector.x) > 0.1 || Math.abs(joystickVector.y) > 0.1) {
                moveX = joystickVector.x;
                moveZ = -joystickVector.y;
            }
            
            const len = Math.sqrt(moveX*moveX + moveZ*moveZ);
            if (len > 1) {
                moveX /= len;
                moveZ /= len;
            }
            
            if (moveX === 0 && moveZ === 0) return;
            
            const target = controls.target;
            const cameraToTarget = new THREE.Vector3().subVectors(target, camera.position).normalize();
            const forwardDir = new THREE.Vector3(cameraToTarget.x, 0, cameraToTarget.z).normalize();
            if (forwardDir.length() < 0.1) forwardDir.set(0, 0, -1);
            
            const rightDir = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), forwardDir).normalize();
            
            const moveDelta = new THREE.Vector3();
            moveDelta.addScaledVector(forwardDir, moveZ * moveSpeed);
            moveDelta.addScaledVector(rightDir, moveX * moveSpeed);
            
            camera.position.add(moveDelta);
            controls.target.add(moveDelta);
            
            if (camera.position.y < 1.5) camera.position.y = 1.5;
            if (camera.position.y > 15) camera.position.y = 15;
            
            const maxDist = 18;
            const targetDist = Math.sqrt(controls.target.x*controls.target.x + controls.target.z*controls.target.z);
            if (targetDist > maxDist) {
                const factor = maxDist / targetDist;
                controls.target.x *= factor;
                controls.target.z *= factor;
                camera.position.x = controls.target.x + (camera.position.x - controls.target.x) * factor;
                camera.position.z = controls.target.z + (camera.position.z - controls.target.z) * factor;
            }
        }

        // --- 海豹动画状态 ---
        let sealTime = 0;
        
        // --- 动画循环 ---
        let clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const elapsedTime = performance.now() / 1000;
            
            // 海豹动画
            sealTime += delta;
            
            sealGroup.children.forEach(child => {
                if (child.userData.isFlipper) {
                    const baseRotZ = child.userData.baseRotZ || 0;
                    const freq = child.position.z > 0 ? 4 : 3;
                    child.rotation.z = baseRotZ + Math.sin(sealTime * freq) * 0.2;
                }
            });
            
            const bodySway = Math.sin(sealTime * 2.5) * 0.03;
            sealGroup.rotation.z = -0.05 + bodySway;
            
            const headSway = Math.sin(sealTime * 1.8) * 0.05;
            sealGroup.rotation.y = 0.2 + headSway;
            
            const breathe = Math.sin(sealTime * 3) * 0.05;
            const baseY = 0.1 + breathe;
            
            if (sealGroup.userData.jumpTime > 0) {
                sealGroup.userData.jumpTime -= delta;
                const jumpProgress = 1 - (sealGroup.userData.jumpTime / 0.3);
                const jumpHeight = Math.sin(jumpProgress * Math.PI) * (sealGroup.userData.jumpOffset || 0.4);
                sealGroup.position.y = baseY + jumpHeight;
            } else {
                sealGroup.position.y = baseY;
            }
            
            sealGroup.position.x = Math.sin(sealTime * 0.5) * 0.1;
            sealGroup.position.z = Math.cos(sealTime * 0.7) * 0.1;
            
            // --- 鱼群游动逻辑 ---
            fishes.forEach(fish => {
                const data = fish.userData;
                
                // 沿着圆周游动，但也会随机改变半径和角度
                data.angle += data.angularSpeed * delta * 60;
                
                // 随机改变方向
                if (Math.random() < 0.005) {
                    data.angularSpeed = (Math.random() * 0.5 + 0.2) * (Math.random() > 0.5 ? 1 : -1) * 0.01;
                }
                
                // 计算新位置（在圆周上，y轴上下浮动）
                const targetX = Math.cos(data.angle) * data.radius;
                const targetZ = Math.sin(data.angle) * data.radius;
                const targetY = data.baseY + Math.sin(elapsedTime * 0.8 + data.wobblePhase) * 0.2;
                
                // 平滑移动
                fish.position.x += (targetX - fish.position.x) * 0.02;
                fish.position.z += (targetZ - fish.position.z) * 0.02;
                fish.position.y += (targetY - fish.position.y) * 0.05;
                
                // 让鱼朝向移动方向
                if (fish.position.length() > 0.1) {
                    const dir = new THREE.Vector3(targetX - fish.position.x, 0, targetZ - fish.position.z).normalize();
                    if (dir.length() > 0.1) {
                        const targetQuat = new THREE.Quaternion().setFromUnitVectors(
                            new THREE.Vector3(1, 0, 0),
                            dir
                        );
                        fish.quaternion.slerp(targetQuat, 0.05);
                    }
                }
                
                // 尾巴摆动
                if (fish.children[1]) { // 尾巴是第二个子元素
                    fish.children[1].rotation.z = Math.PI / 2 + Math.sin(elapsedTime * 8 + data.wobblePhase) * 0.3;
                }
            });
            
            // 水面轻微波动
            waterPlane.position.y = 0.02 + Math.sin(elapsedTime * 1.5) * 0.01;
            
            // 处理相机移动
            moveCamera();
            
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // 窗口自适应
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('🦭 海豹会持续游动，点击它试试看！水下有鱼群游过～');
    </script>
</body>
</html>
